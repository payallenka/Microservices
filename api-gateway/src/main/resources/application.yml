spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        # lb:// resolves the service name through Eureka and load-balances across its instances.
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/books/**
        - id: review-service
          uri: lb://review-service
          predicates:
            - Path=/api/reviews/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
